{{- /*
One document for the model's top-level fields (kind: Model), then one per gateway
(kind: IngressGateway or EgressGateway) and per enabled allowedHosts entry (kind: AllowedHost),
so tests can pick one with documentSelector on its path.
*/ -}}
{{- $root := dict "Values" .Values.boundary "Release" .Release "Chart" .Chart -}}
{{- $model := include "boundary.model" $root | fromJson -}}
kind: Model
path: model
{{ omit $model "ingress" "egress" | toYaml }}
ingress:
  namespace: {{ $model.ingress.namespace }}
  gateways: {{ include "probe.names" $model.ingress.gateways }}
egress:
  namespace: {{ $model.egress.namespace }}
  default: {{ $model.egress.default | quote }}
  gateways: {{ include "probe.names" $model.egress.gateways }}
{{- range $model.ingress.gateways }}
---
kind: IngressGateway
{{ toYaml . }}
{{- end }}
{{- range $model.egress.gateways }}
---
kind: EgressGateway
{{ toYaml (omit . "allowedHosts") }}
allowedHosts: {{ include "probe.names" .allowedHosts }}
{{- range .allowedHosts }}
---
kind: AllowedHost
{{ toYaml . }}
{{- end }}
{{- end }}

{{- define "probe.names" -}}
{{- $names := list -}}
{{- range . -}}{{- $names = append $names .name -}}{{- end -}}
{{- toJson $names -}}
{{- end -}}
