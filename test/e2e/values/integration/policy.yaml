# The policy chart in the integration run (test/e2e/integration.sh): its defaults, enforced
# (enforcement: enforce is the chart's default and stays), plus what a site running boundary
# sets (README, "Running under the policy chart"). Nothing here loosens a default for boundary's
# sake: the gateway and waypoint pods are admitted with only the exception posture's
# istio-ingress and istio-egress profiles carry. The e2e workloads meet every default-on policy
# (test/e2e/lib.sh, workload).
policies:
  # Default on, at audit: enforced here, as posture's e2e does.
  disallow-default-service-account: { action: enforce }
  disallow-rbac-escalation-verbs: { action: enforce }
  disallow-secrets-in-env: { action: enforce }
  disallow-shared-process-namespace: { action: enforce }
  # Default on, at audit, and left at audit until the posture pin is 0.3.0: posture 0.2.0's
  # istio-system profile doesn't except istiod and ztunnel from these two, so enforcing them
  # would refuse the control plane. The gateway and waypoint pods meet both (the infrastructure
  # ConfigMap), which integration.sh checks on the pods (admission_checks).
  #   require-probes
  #   disallow-automount-service-account-token
  # Baked-in: the registries the run's images come from, fully qualified (prefix match).
  restrict-image-registries:
    registries:
      - docker.io/istio/          # istiod, ztunnel, the gateway and waypoint proxies
      - registry.k8s.io/          # agnhost (AGNHOST_IMAGE)
      - docker.io/curlimages/     # curl (CURL_IMAGE)
  # Default on: only the ingress gateways' namespace gets LoadBalancer Services. The run's
  # gateway is ClusterIP, but a site's is a LoadBalancer (ingress.gateways.<gateway>.service).
  restrict-loadbalancer-services:
    namespaces: [ingress-gateway]
  # Default on: no "*" in Roles and ClusterRoles. The upstream istiod chart's two ClusterRoles
  # (named -<istiod's namespace>) use it: read-only "*" resources in Istio's own API groups and
  # gateway.networking.k8s.io, and "*" verbs on ingresses/status. They're Istio's, set by its
  # chart, so they're allowed by name.
  restrict-wildcard-rbac:
    allowedRoles:
      - istiod-clusterrole-istio-system
      - istio-reader-clusterrole-istio-system
  # Optional, turned on and enforced: a route may only claim hostnames under its own namespace
  # (shop -> *.shop.e2e.test). The ingress gateways' namespace is skipped: boundary's
  # redirect-http-to-https-<gateway> route has no hostnames, since it answers every hostname of
  # its HTTP listener (policy 0.2.1+).
  restrict-route-hostnames:
    enabled: true
    action: enforce
    domains: [e2e.test]
    namespaces: [ingress-gateway]
