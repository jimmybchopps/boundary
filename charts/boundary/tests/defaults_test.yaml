suite: defaults
templates:
  - templates/istio/*.yaml
  - templates/validate.yaml
release:
  name: boundary
  namespace: istio-system
tests:
  - it: renders mtls-strict and the https gateway with its objects
    asserts:
      - hasDocuments: { count: 1 }
        template: templates/istio/peerauthentication.yaml
      - hasDocuments: { count: 0 }
        template: templates/istio/deny-all.yaml
      - hasDocuments: { count: 0 }
        template: templates/validate.yaml
      - hasDocuments: { count: 1 }
        template: templates/istio/ingress-gateway.yaml
      - equal: { path: metadata.name, value: https }
        template: templates/istio/ingress-gateway.yaml
      - hasDocuments: { count: 1 }
        template: templates/istio/ingress-infrastructure.yaml
      - hasDocuments: { count: 1 }
        template: templates/istio/ingress-redirect.yaml
      - hasDocuments: { count: 1 }
        template: templates/istio/ingress-tls.yaml
      - hasDocuments: { count: 1 }
        template: templates/istio/telemetry.yaml

  - it: the PeerAuthentication carries the labels and the rule annotation
    template: templates/istio/peerauthentication.yaml
    asserts:
      - isKind: { of: PeerAuthentication }
      - equal: { path: metadata.name, value: mtls-strict }
      - equal: { path: metadata.namespace, value: istio-system }
      - equal:
          path: metadata.labels
          value:
            helm.sh/chart: boundary-0.1.0
            app.kubernetes.io/name: boundary
            app.kubernetes.io/instance: boundary
            app.kubernetes.io/managed-by: Helm
      - equal:
          path: metadata.annotations
          value: { boundary.posture.dev/rule: mtls.mode }
