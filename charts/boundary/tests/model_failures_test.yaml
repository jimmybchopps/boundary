suite: model failures
templates:
  - templates/validate.yaml
tests:
  - it: valid values render nothing
    values: [../../../examples/full.yaml]
    asserts:
      - hasDocuments: { count: 0 }

  # Phases that haven't landed.

  - it: mesh linkerd isn't supported yet
    set:
      mesh: linkerd
    asserts:
      - failedTemplate:
          errorPattern: 'boundary: mesh: "linkerd" isn''t supported yet \(phase 5 adds it\)'

  - it: mesh none isn't supported yet
    set:
      mesh: none
    asserts:
      - failedTemplate:
          errorPattern: 'boundary: mesh: "none" isn''t supported yet \(phase 5 adds it\)'

  - it: mesh cilium isn't supported yet
    set:
      mesh: cilium
    asserts:
      - failedTemplate:
          errorPattern: 'boundary: mesh: "cilium" isn''t supported yet \(phase 7 adds it\)'

  - it: ingress.implementation envoy-gateway isn't supported yet
    set:
      ingress.implementation: envoy-gateway
    asserts:
      - failedTemplate:
          errorPattern: 'boundary: ingress.implementation: "envoy-gateway" isn''t supported yet \(phase 5 adds it\)'

  - it: ingress.implementation cilium isn't supported yet
    set:
      ingress.implementation: cilium
    asserts:
      - failedTemplate:
          errorPattern: 'boundary: ingress.implementation: "cilium" isn''t supported yet \(phase 7 adds it\)'

  - it: ingress.implementation istio is accepted
    set:
      ingress.implementation: istio
    asserts:
      - notFailedTemplate: {}

  # Default egress gateway.

  - it: two enabled default egress gateways fail, naming both
    set:
      egress.gateways.second: { default: true }
    asserts:
      - failedTemplate:
          errorPattern: 'boundary: egress.gateways: exactly one enabled gateway may have default: true; 2 do: default, second'

  - it: no default among the enabled egress gateways fails
    set:
      egress.gateways.default.default: false
      egress.gateways.second: {}
    asserts:
      - failedTemplate:
          errorPattern: 'boundary: egress.gateways: one enabled gateway needs default: true; none of default, second has it'

  - it: a disabled second default doesn't count
    set:
      egress.gateways.second: { enabled: false, default: true }
    asserts:
      - notFailedTemplate: {}

  - it: switching the default moves it to another gateway
    set:
      egress.gateways.default.enabled: false
      egress.gateways.second: { default: true }
    asserts:
      - notFailedTemplate: {}

  - it: no enabled egress gateway needs no default
    set:
      egress.gateways.default.enabled: false
    asserts:
      - notFailedTemplate: {}

  # allowedHosts entries.

  - it: an entry with both hosts and addresses fails
    set:
      egress.gateways.default.allowedHosts.github:
        hosts: [api.github.com]
        addresses: [140.82.112.0/20]
        ports: [443]
    asserts:
      - failedTemplate:
          errorPattern: 'boundary: egress.gateways.default.allowedHosts.github: set hosts or addresses, not both'

  - it: an entry with neither hosts nor addresses fails
    set:
      egress.gateways.default.allowedHosts.github:
        ports: [443]
    asserts:
      - failedTemplate:
          errorPattern: 'boundary: egress.gateways.default.allowedHosts.github: hosts or addresses is required'

  - it: an entry without ports fails
    set:
      egress.gateways.default.allowedHosts.github:
        hosts: [api.github.com]
    asserts:
      - failedTemplate:
          errorPattern: 'boundary: egress.gateways.default.allowedHosts.github: ports are required'

  - it: an entry with empty ports fails
    set:
      egress.gateways.default.allowedHosts.github:
        hosts: [api.github.com]
        ports: []
    asserts:
      - failedTemplate:
          errorPattern: 'boundary: egress.gateways.default.allowedHosts.github: ports are required'

  - it: TCP with hosts fails
    set:
      egress.gateways.default.allowedHosts.github:
        hosts: [api.github.com]
        ports: [22]
        protocol: TCP
    asserts:
      - failedTemplate:
          errorPattern: 'boundary: egress.gateways.default.allowedHosts.github: TCP can''t be matched by host name'

  - it: TLS (the default protocol) with addresses fails
    set:
      egress.gateways.default.allowedHosts.mirror:
        addresses: [203.0.113.10/32]
        ports: [443]
    asserts:
      - failedTemplate:
          errorPattern: 'boundary: egress.gateways.default.allowedHosts.mirror: TLS is matched by host name \(the TLS server name\), so it needs hosts'

  - it: HTTP with addresses fails
    set:
      egress.gateways.default.allowedHosts.mirror:
        addresses: [203.0.113.10/32]
        ports: [80]
        protocol: HTTP
    asserts:
      - failedTemplate:
          errorPattern: 'boundary: egress.gateways.default.allowedHosts.mirror: HTTP is matched by host name \(the Host header\)'

  - it: a disabled entry is still checked
    set:
      egress.gateways.default.allowedHosts.github:
        enabled: false
        hosts: [api.github.com]
    asserts:
      - failedTemplate:
          errorPattern: 'boundary: egress.gateways.default.allowedHosts.github: ports are required'

  - it: an entry under a disabled gateway is still checked
    set:
      egress.gateways.default.enabled: false
      egress.gateways.default.allowedHosts.github:
        hosts: [api.github.com]
        addresses: [140.82.112.0/20]
        ports: [443]
    asserts:
      - failedTemplate:
          errorPattern: 'set hosts or addresses, not both'

  # Listeners.

  - it: an HTTPS listener without certificates fails
    set:
      ingress.gateways.https.listeners.https.certificates: []
    asserts:
      - failedTemplate:
          errorPattern: 'boundary: ingress.gateways.https.listeners.https: an HTTPS listener needs certificates'

  - it: a new HTTPS listener without certificates fails
    set:
      ingress.gateways.https.listeners.internal: { port: 8443, protocol: HTTPS }
    asserts:
      - failedTemplate:
          errorPattern: 'boundary: ingress.gateways.https.listeners.internal: an HTTPS listener needs certificates'

  - it: a disabled HTTPS listener without certificates is still checked
    set:
      ingress.gateways.https.listeners.internal: { enabled: false, port: 8443, protocol: HTTPS }
    asserts:
      - failedTemplate:
          errorPattern: 'listeners.internal: an HTTPS listener needs certificates'

  - it: tls on a passthrough listener fails
    set:
      ingress.gateways.tls-passthrough.listeners.tls.tls: { minVersion: TLSv1_3 }
    asserts:
      - failedTemplate:
          errorPattern: 'boundary: ingress.gateways.tls-passthrough.listeners.tls: tls applies only to HTTPS listeners, which terminate TLS; a TLS listener passes TLS through'

  - it: tls on a TCP listener fails
    set:
      ingress.gateways.tcp.listeners.postgres:
        port: 5432
        protocol: TCP
        namespace: databases
        tls: { minVersion: TLSv1_3 }
    asserts:
      - failedTemplate:
          errorPattern: 'boundary: ingress.gateways.tcp.listeners.postgres: tls applies only to HTTPS listeners, which terminate TLS; a TCP listener carries raw TCP'

  - it: tls on an HTTP listener fails
    set:
      ingress.gateways.https.listeners.http.tls: { minVersion: TLSv1_3 }
    asserts:
      - failedTemplate:
          errorPattern: 'listeners.http: tls applies only to HTTPS listeners'

  - it: certificates on a passthrough listener fail
    set:
      ingress.gateways.tls-passthrough.listeners.tls.certificates: [apps-tls]
    asserts:
      - failedTemplate:
          errorPattern: 'listeners.tls: certificates apply only to HTTPS listeners'

  - it: a TCP listener without namespace fails
    set:
      ingress.gateways.tcp.listeners.postgres: { port: 5432, protocol: TCP }
    asserts:
      - failedTemplate:
          errorPattern: 'boundary: ingress.gateways.tcp.listeners.postgres: a TCP listener needs namespace'

  - it: a TCP listener with a hostname fails
    set:
      ingress.gateways.tcp.listeners.postgres:
        port: 5432
        protocol: TCP
        namespace: databases
        hostname: db.example.mil
    asserts:
      - failedTemplate:
          errorPattern: 'listeners.postgres: hostname doesn''t apply to a TCP listener'

  - it: namespace on a non-TCP listener fails
    set:
      ingress.gateways.https.listeners.https.namespace: apps
    asserts:
      - failedTemplate:
          errorPattern: 'listeners.https: namespace applies only to TCP listeners'

  - it: redirectToHTTPS on a non-HTTP listener fails
    set:
      ingress.gateways.https.listeners.https.redirectToHTTPS: true
    asserts:
      - failedTemplate:
          errorPattern: 'listeners.https: redirectToHTTPS applies only to HTTP listeners; this one is HTTPS'

  - it: an enabled gateway without enabled listeners fails
    set:
      ingress.gateways.tcp.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: 'boundary: ingress.gateways.tcp: an enabled gateway needs at least one enabled listener'

  - it: an enabled gateway whose listeners are all disabled fails
    set:
      ingress.gateways.https.listeners.https.enabled: false
      ingress.gateways.https.listeners.http.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: 'boundary: ingress.gateways.https: an enabled gateway needs at least one enabled listener'

  # TLS versions.

  - it: a chart-wide minVersion above maxVersion fails
    set:
      tls: { minVersion: TLSv1_3, maxVersion: TLSv1_2 }
    asserts:
      - failedTemplate:
          errorPattern: 'boundary: tls: minVersion TLSv1_3 is above maxVersion TLSv1_2'

  - it: a listener override above the chart-wide maxVersion fails
    set:
      tls.maxVersion: TLSv1_2
      ingress.gateways.https.listeners.https.tls: { minVersion: TLSv1_3 }
    asserts:
      - failedTemplate:
          errorPattern: 'boundary: ingress.gateways.https.listeners.https.tls: minVersion TLSv1_3 is above maxVersion TLSv1_2'

  # Listeners sharing a port.

  - it: listeners on one port with different protocols fail
    set:
      ingress.gateways.https.listeners.http.port: 443
    asserts:
      - failedTemplate:
          errorPattern: 'boundary: ingress.gateways.https: listeners http and https share port 443 with protocols HTTP and HTTPS'

  - it: listeners on one port with the same hostname fail
    set:
      ingress.gateways.https.listeners.https.hostname: "*.apps.example.mil"
      ingress.gateways.https.listeners.internal:
        { port: 443, protocol: HTTPS, hostname: "*.apps.example.mil", certificates: [internal-tls] }
    asserts:
      - failedTemplate:
          errorPattern: 'boundary: ingress.gateways.https: listeners https and internal share port 443 and hostname "\*.apps.example.mil"; give each its own hostname'

  - it: HTTPS listeners sharing a port each need a hostname
    set:
      ingress.gateways.https.listeners.internal:
        { port: 443, protocol: HTTPS, hostname: "*.internal.example.mil", certificates: [internal-tls] }
    asserts:
      - failedTemplate:
          errorPattern: 'boundary: ingress.gateways.https: HTTPS listener https shares port 443 with other HTTPS listeners, so it needs a hostname'

  - it: two TCP listeners on one port fail
    set:
      ingress.gateways.tcp:
        enabled: true
        listeners:
          a: { port: 5432, protocol: TCP, namespace: one }
          b: { port: 5432, protocol: TCP, namespace: two }
    asserts:
      - failedTemplate:
          errorPattern: 'boundary: ingress.gateways.tcp: TCP listeners a and b share port 5432; each TCP service needs its own port'

  - it: a disabled listener doesn't share its port
    set:
      ingress.gateways.https.listeners.internal:
        { enabled: false, port: 443, protocol: HTTPS, certificates: [internal-tls] }
    asserts:
      - notFailedTemplate: {}

  # Redirects.

  - it: redirectToHTTPS without an HTTPS listener fails
    set:
      ingress.gateways.https.listeners.https.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: 'boundary: ingress.gateways.https.listeners.http: redirectToHTTPS needs an HTTPS listener on the same gateway'

  - it: redirectToHTTPS with HTTPS listeners on several ports fails
    set:
      ingress.gateways.https.listeners.admin: { port: 8443, protocol: HTTPS, certificates: [admin-tls] }
    asserts:
      - failedTemplate:
          errorPattern: 'boundary: ingress.gateways.https.listeners.http: redirectToHTTPS needs one HTTPS port on the gateway; its HTTPS listeners use ports 443, 8443'

  # Cipher suites under TLS 1.3.

  - it: chart-wide cipherSuites with minVersion TLSv1_3 fail
    set:
      tls: { minVersion: TLSv1_3, cipherSuites: [ECDHE-RSA-AES256-GCM-SHA384] }
    asserts:
      - failedTemplate:
          errorPattern: 'boundary: tls: cipherSuites apply only to TLS 1.2, and minVersion is TLSv1_3'

  - it: a listener's cipherSuites with an effective minVersion TLSv1_3 fail
    set:
      tls.minVersion: TLSv1_3
      ingress.gateways.https.listeners.https.tls: { cipherSuites: [ECDHE-RSA-AES256-GCM-SHA384] }
    asserts:
      - failedTemplate:
          errorPattern: 'boundary: ingress.gateways.https.listeners.https.tls: cipherSuites apply only to TLS 1.2'

  - it: inherited cipherSuites under a listener's TLSv1_3 are dropped, not an error
    set:
      tls.cipherSuites: [ECDHE-RSA-AES256-GCM-SHA384]
      ingress.gateways.https.listeners.https.tls: { minVersion: TLSv1_3 }
    asserts:
      - notFailedTemplate: {}

  # Infrastructure and service.

  - it: autoscaling minReplicas above maxReplicas fails
    set:
      ingress.gateways.https.infrastructure.autoscaling: { enabled: true, minReplicas: 6, maxReplicas: 3 }
    asserts:
      - failedTemplate:
          errorPattern: 'boundary: ingress.gateways.https.infrastructure.autoscaling: minReplicas 6 is above maxReplicas 3'

  - it: minAvailable at the replica count fails
    set:
      ingress.gateways.https.infrastructure.replicas: 1
    asserts:
      - failedTemplate:
          errorPattern: 'boundary: ingress.gateways.https.infrastructure.podDisruptionBudget: minAvailable 1 must be below the replica count \(1\)'

  - it: under autoscaling, minAvailable is compared with minReplicas
    set:
      ingress.gateways.https.infrastructure:
        replicas: 1
        autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 4 }
    asserts:
      - notFailedTemplate: {}

  - it: a percentage minAvailable isn't compared
    set:
      ingress.gateways.https.infrastructure:
        replicas: 1
        podDisruptionBudget: { minAvailable: 50% }
    asserts:
      - notFailedTemplate: {}

  - it: a disabled gateway's infrastructure is still checked
    set:
      ingress.gateways.tls-passthrough.infrastructure.replicas: 1
    asserts:
      - failedTemplate:
          errorPattern: 'boundary: ingress.gateways.tls-passthrough.infrastructure.podDisruptionBudget'

  - it: an egress gateway's infrastructure is checked too
    set:
      egress.gateways.default.infrastructure.replicas: 1
    asserts:
      - failedTemplate:
          errorPattern: 'boundary: egress.gateways.default.infrastructure.podDisruptionBudget'

  - it: loadBalancerIP with another service type fails
    set:
      ingress.gateways.https.service: { type: ClusterIP, loadBalancerIP: 10.0.0.5 }
    asserts:
      - failedTemplate:
          errorPattern: 'boundary: ingress.gateways.https.service: loadBalancerIP applies only to type LoadBalancer; type is ClusterIP'

  # Egress gateways (phase 3).
  - it: exitNodes and infrastructure.nodeSelector disagreeing on a key fails
    set:
      egress.gateways.default:
        exitNodes: { node.example.mil/exit: "true" }
        infrastructure: { nodeSelector: { node.example.mil/exit: "false" } }
    asserts:
      - failedTemplate:
          errorPattern: 'boundary: egress.gateways.default.exitNodes: node.example.mil/exit is "true" here and "false" in infrastructure.nodeSelector'

  - it: an ingress and an egress gateway with the same name in one namespace fail
    set:
      ingress.namespace: gateways
      egress.namespace: gateways
      ingress.gateways.default:
        listeners:
          http: { port: 80, protocol: HTTP }
    asserts:
      - failedTemplate:
          errorPattern: 'boundary: egress.gateways.default: ingress.gateways.default has the same name, and both are in namespace gateways'

  - it: the same names in separate namespaces are fine
    set:
      ingress.gateways.default:
        listeners:
          http: { port: 80, protocol: HTTP }
    asserts:
      - notFailedTemplate: {}
