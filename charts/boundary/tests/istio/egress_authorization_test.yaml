suite: egress limit AuthorizationPolicies (egress.gateways.<gateway>.allowedHosts)
templates:
  - templates/istio/egress-authorization.yaml
tests:
  - it: with no entries, the waypoint still gets its allow-nothing policy
    asserts:
      - hasDocuments: { count: 1 }
      - isKind: { of: AuthorizationPolicy }
      - isAPIVersion: { of: security.istio.io/v1 }
      - equal: { path: metadata.name, value: deny-egress-via-default }
      - equal: { path: metadata.namespace, value: egress-gateway }
      - equal: { path: metadata.annotations, value: { boundary.posture.dev/rule: egress.gateways.default.allowedHosts } }
      - equal:
          path: spec
          value:
            targetRefs: [{ group: gateway.networking.k8s.io, kind: Gateway, name: default }]
            action: ALLOW

  - it: TLS is matched by server name (connection.sni) and port
    set:
      egress.gateways.default.allowedHosts.github:
        hosts: [api.github.com, "*.githubusercontent.com"]
        ports: [443, 8443]
        protocol: TLS
    documentSelector: { path: metadata.name, value: allow-egress-via-default-to-github }
    asserts:
      - equal: { path: metadata.annotations, value: { boundary.posture.dev/rule: egress.gateways.default.allowedHosts.github } }
      - equal:
          path: spec
          value:
            targetRefs: [{ group: gateway.networking.k8s.io, kind: Gateway, name: default }]
            action: ALLOW
            rules:
              - to: [{ operation: { ports: ["443", "8443"] } }]
                when: [{ key: connection.sni, values: [api.github.com, "*.githubusercontent.com"] }]

  - it: TLS is the default protocol
    set:
      egress.gateways.default.allowedHosts.github: { hosts: [api.github.com], ports: [443] }
    documentSelector: { path: metadata.name, value: allow-egress-via-default-to-github }
    asserts:
      - equal: { path: "spec.rules[0].when[0].key", value: connection.sni }

  - it: HTTP is matched by Host and port
    set:
      egress.gateways.default.allowedHosts.os-updates:
        hosts: [archive.ubuntu.com, "*.ubuntu.com"]
        ports: [80]
        protocol: HTTP
    documentSelector: { path: metadata.name, value: allow-egress-via-default-to-os-updates }
    asserts:
      - equal:
          path: spec.rules
          value:
            - to: [{ operation: { hosts: [archive.ubuntu.com, "*.ubuntu.com"], ports: ["80"] } }]

  - it: TCP is matched by address and port
    set:
      egress.gateways.default.allowedHosts.mirror:
        addresses: [203.0.113.10/32, 198.51.100.7]
        ports: [443]
        protocol: TCP
    documentSelector: { path: metadata.name, value: allow-egress-via-default-to-mirror }
    asserts:
      - equal:
          path: spec.rules
          value:
            - to: [{ operation: { ports: ["443"] } }]
              when: [{ key: destination.ip, values: [203.0.113.10/32, 198.51.100.7] }]

  - it: a disabled entry renders nothing
    set:
      egress.gateways.default.allowedHosts.github: { enabled: false, hosts: [api.github.com], ports: [443] }
    asserts:
      - hasDocuments: { count: 1 }
      - equal: { path: metadata.name, value: deny-egress-via-default }

  - it: each gateway's policies target its own waypoint
    set:
      egress.gateways.default.allowedHosts.github: { hosts: [api.github.com], ports: [443] }
      egress.gateways.partner.allowedHosts.api: { hosts: [api.partner.example.com], ports: [443] }
    asserts:
      - hasDocuments: { count: 4 }
      - equal: { path: "spec.targetRefs[0].name", value: default }
        documentSelector: { path: metadata.name, value: allow-egress-via-default-to-github }
      - equal: { path: "spec.targetRefs[0].name", value: partner }
        documentSelector: { path: metadata.name, value: allow-egress-via-partner-to-api }
      - equal: { path: "spec.targetRefs[0].name", value: partner }
        documentSelector: { path: metadata.name, value: deny-egress-via-partner }
