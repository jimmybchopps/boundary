suite: access logs Telemetry (accessLogs)
templates:
  - templates/istio/telemetry.yaml
tests:
  - it: one per ingress gateway, then one per egress waypoint, with the envoy provider
    set:
      ingress.gateways.tls-passthrough.enabled: true
      egress.gateways.second: {}
    asserts:
      - hasDocuments: { count: 4 }
      - isKind: { of: Telemetry }
      - isAPIVersion: { of: telemetry.istio.io/v1 }
      - equal: { path: metadata.annotations, value: { boundary.posture.dev/rule: accessLogs } }
      - equal: { path: metadata.namespace, value: ingress-gateway }
        documentIndex: 0
      - equal: { path: metadata.name, value: access-logs-tls-passthrough }
        documentIndex: 1
      - equal:
          path: spec
          value:
            targetRefs: [{ group: gateway.networking.k8s.io, kind: Gateway, name: https }]
            accessLogging: [{ providers: [{ name: envoy }] }]
        documentIndex: 0
      - equal: { path: metadata.name, value: access-logs-default }
        documentIndex: 2
      - equal: { path: metadata.namespace, value: egress-gateway }
        documentIndex: 2
      - equal:
          path: spec
          value:
            targetRefs: [{ group: gateway.networking.k8s.io, kind: Gateway, name: second }]
            accessLogging: [{ providers: [{ name: envoy }] }]
        documentIndex: 3

  - it: a waypoint's Telemetry goes in egress.namespace
    set:
      ingress.gateways.https.enabled: false
      egress.namespace: egress-alt
    asserts:
      - hasDocuments: { count: 1 }
      - equal: { path: metadata.namespace, value: egress-alt }

  - it: off renders nothing
    set:
      accessLogs.enabled: false
    asserts:
      - hasDocuments: { count: 0 }
