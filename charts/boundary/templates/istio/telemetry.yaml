{{- /*
accessLogs: one Telemetry per gateway, access-logs-<gateway>, targeting it, with Istio's
built-in envoy log provider (every request and connection on the gateway's stdout).
*/ -}}
{{- $model := include "boundary.model" . | fromJson -}}
{{- if and (eq $model.mesh "istio") $model.accessLogs.enabled }}
{{- range $gateway := $model.ingress.gateways }}
---
apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: {{ $gateway.accessLogsName }}
  namespace: {{ $model.ingress.namespace }}
  labels:
    {{- include "boundary.labels" $ | nindent 4 }}
  annotations:
    {{- include "boundary.annotations" "accessLogs" | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $gateway.name }}
  accessLogging:
    - providers:
        - name: envoy
{{- end }}
{{- end }}
