{{- /*
redirectToHTTPS: one HTTPRoute per gateway, redirect-http-to-https-<gateway>, attached to each
HTTP listener with redirectToHTTPS, answering every request with a 301 to HTTPS (on the
gateway's HTTPS port when it isn't 443). Those listeners admit routes only from the ingress
namespace, so no application route can attach to them.
*/ -}}
{{- $model := include "boundary.model" . | fromJson -}}
{{- if eq $model.implementation "istio" }}
{{- range $gateway := $model.ingress.gateways }}
{{- $redirects := list }}
{{- range $gateway.listeners }}{{ if .redirectToHTTPS }}{{ $redirects = append $redirects . }}{{ end }}{{ end }}
{{- if $redirects }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $gateway.redirectName }}
  namespace: {{ $model.ingress.namespace }}
  labels:
    {{- include "boundary.labels" $ | nindent 4 }}
  annotations:
    {{- $paths := list }}
    {{- range $redirects }}{{ $paths = append $paths (printf "%s.redirectToHTTPS" .path) }}{{ end }}
    {{- include "boundary.annotations" (join ", " $paths) | nindent 4 }}
spec:
  parentRefs:
    {{- range $redirects }}
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $gateway.name }}
      sectionName: {{ .name }}
    {{- end }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
            {{- if ne (int $gateway.redirectPort) 443 }}
            port: {{ int $gateway.redirectPort }}
            {{- end }}
{{- end }}
{{- end }}
{{- end }}
